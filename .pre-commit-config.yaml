repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint check
        entry: ruff check
        language: system
        types: [python]

      - id: black
        name: Black formatting check
        entry: black --check
        language: system
        types: [python]

      - id: python-compile
        name: Python syntax check
        entry: python -m compileall -q
        language: system
        types: [python]
